name: Pattern Buddy Weekly Rebuild

# Lives once in the backend's own repo (not in every target repo — that was
# the old, non-scaling design). Hits /admin/reindex-all, which loops over
# every repo the GitHub App is installed on.

on:
  schedule:
    - cron: '0 3 * * 0'  # Sundays 03:00 UTC (off-peak)
  workflow_dispatch: {}  # allows manual re-trigger (webhook delivery failure recovery)

concurrency:
  group: weekly-rebuild-all
  cancel-in-progress: false

jobs:
  trigger-rebuild-all:
    name: Trigger Pattern Buddy reindex for every installed repo
    runs-on: ubuntu-latest

    steps:
      - name: Sign empty payload, POST to Pattern Buddy
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BACKEND_API_URL: https://pattern-buddy-v2-gabre3endda8gwck.northcentralus-01.azurewebsites.net
        run: |
          PAYLOAD='{}'

          SIGNATURE="sha256=$(echo -n "$PAYLOAD" | \
            openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | \
            awk '{print $2}')"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${BACKEND_API_URL}/admin/reindex-all" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: ${SIGNATURE}" \
            -d "$PAYLOAD")

          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "202" ]; then
            echo "ERROR: Expected 202 Accepted, got $HTTP_STATUS"
            exit 1
          fi
